# Kafka / Nuxeo Stream settings — appended to nuxeo.conf at startup via a
# /etc/nuxeo/conf.d/ mount (see compose.yaml). Switches Nuxeo Stream from the
# default in-memory Chronicle Queue to Kafka so audit records are published to
# the broker (topic nuxeo-audit-audit) for external consumption.

kafka.enabled=true
kafka.bootstrap.servers=kafka:29092
kafka.topicPrefix=nuxeo-
kafka.default.replication.factor=1

# Stream Audit Writer: decouples audit persistence and publishes entries onto
# the audit/audit stream (physical Kafka topic: nuxeo-audit-audit).
nuxeo.stream.audit.enabled=true
